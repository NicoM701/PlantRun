<!doctype html>
<!-- Three structural variants for the remaining PlantRun review flows, switchable via ?variant=. Disposable prototype, never production code. -->
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantRun Review-Prototyp</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111510;
      --rail: #151a14;
      --surface: #191f18;
      --surface-2: #20271f;
      --surface-3: #283126;
      --text: #eef1e9;
      --muted: #98a093;
      --line: rgba(230,238,224,.12);
      --line-strong: rgba(230,238,224,.23);
      --green: #83a96d;
      --green-bright: #a9d58e;
      --green-ink: #11180e;
      --amber: #d1aa48;
      --red: #cb6f65;
      --blue: #7fa6bf;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      font-family: Aptos, "Segoe UI", system-ui, sans-serif;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #eef3eb;
      --rail: #f5f8f2;
      --surface: #fbfcf9;
      --surface-2: #e5ece1;
      --surface-3: #d8e3d3;
      --text: #172017;
      --muted: #687164;
      --line: rgba(28,48,29,.12);
      --line-strong: rgba(28,48,29,.22);
      --green: #668b53;
      --green-bright: #477239;
      --green-ink: #f8fff4;
      --amber: #a47b16;
      --red: #a14f48;
      --blue: #557f98;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; margin: 0; background: var(--bg); color: var(--text); }
    body, button, input, select, textarea { font: inherit; }
    button, a, select { cursor: pointer; }
    button, input, select, textarea { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid rgba(131,169,109,.45); outline-offset: 2px; }
    h1, h2, h3, p { margin-top: 0; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.small { width: 16px; height: 16px; }
    .prototype { min-height: 100vh; background: var(--bg); }
    .shell { display: grid; grid-template-columns: 76px minmax(0,1fr); min-height: 100vh; }
    .rail { position: sticky; top: 0; z-index: 15; display: flex; height: 100vh; flex-direction: column; align-items: center; gap: 8px; padding: 15px 10px; border-right: 1px solid var(--line); background: var(--rail); }
    .brand { display: grid; width: 44px; height: 44px; margin-bottom: 20px; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-md); color: var(--green-bright); }
    .rail-button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-left: 2px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--muted); }
    .rail-button:hover, .rail-button.active { border-left-color: var(--green); background: var(--surface-2); color: var(--text); }
    .rail-button.bottom { margin-top: auto; }
    .main { width: min(1460px,100%); margin: 0 auto; padding: 20px clamp(22px,3.5vw,56px) 120px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 44px; margin-bottom: 28px; }
    .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .crumbs button { padding: 0; border: 0; background: transparent; color: inherit; }
    .top-actions { display: flex; align-items: center; gap: 7px; }
    .language { display: flex; overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius-md); }
    .language button { min-width: 42px; height: 34px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; }
    .language button.active { background: var(--surface-3); color: var(--text); }
    .flag { display: inline-block; width: 17px; height: 11px; margin-right: 5px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; }
    .icon-button { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
    .page-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .page-head h1 { margin-bottom: 5px; font-size: clamp(27px,3.2vw,43px); font-weight: 590; letter-spacing: -.04em; }
    .page-head p { max-width: 720px; margin-bottom: 0; color: var(--muted); line-height: 1.5; }
    .eyebrow { margin-bottom: 7px; color: var(--green-bright); font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .prototype-note { color: var(--muted); font-size: 9px; }
    .button { display: inline-flex; min-height: 39px; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--radius-md); background: var(--surface-2); font-weight: 680; }
    .button.primary { background: var(--green); color: var(--green-ink); }
    .button.outline { border-color: var(--line-strong); background: transparent; }
    .button.danger { border-color: rgba(203,111,101,.45); background: rgba(203,111,101,.1); color: #e9a29a; }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .button.small { min-height: 33px; padding: 0 10px; font-size: 10px; }
    .link-button { padding: 0; border: 0; background: transparent; color: var(--green-bright); font-size: 10px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); }
    .panel-pad { padding: 22px; }
    .panel-head { display: flex; align-items: start; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .panel-head h2 { margin-bottom: 4px; font-size: 18px; font-weight: 620; }
    .panel-head p { margin-bottom: 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .section-label { margin: 0 0 9px; color: var(--muted); font-size: 8px; letter-spacing: .09em; text-transform: uppercase; }
    .rule-list { border-top: 1px solid var(--line); }
    .rule-row { display: grid; grid-template-columns: minmax(150px,1fr) minmax(180px,1.4fr) auto; gap: 16px; align-items: center; min-height: 58px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .rule-row strong, .rule-row small { display: block; }
    .rule-row strong { font-size: 12px; }
    .rule-row small { margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .value { font-variant-numeric: tabular-nums; font-weight: 700; }
    .tag { display: inline-flex; min-height: 25px; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted); font-size: 8px; font-weight: 700; white-space: nowrap; }
    .tag.good { border-color: rgba(131,169,109,.4); color: var(--green-bright); }
    .tag.warn { border-color: rgba(209,170,72,.4); color: var(--amber); }
    .tag.bad { border-color: rgba(203,111,101,.4); color: var(--red); }
    .tag::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 9px; }
    .field input, .field select, .field textarea { width: 100%; min-height: 41px; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-2); }
    .field textarea { min-height: 120px; resize: vertical; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field.full { grid-column: 1 / -1; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
    .tab { min-height: 39px; padding: 0 13px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 10px; }
    .tab.active { border-bottom-color: var(--green); color: var(--text); }
    .plant-id { display: flex; align-items: center; gap: 11px; }
    .plant-id img { width: 48px; height: 48px; border-radius: var(--radius-md); object-fit: cover; }
    .plant-id strong, .plant-id small { display: block; }
    .plant-id small { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .metric-bar { display: grid; grid-template-columns: repeat(18,1fr); gap: 3px; }
    .metric-bar i { height: 6px; background: var(--surface-3); }
    .metric-bar i.on { background: var(--green); }
    .metric-bar.warn i.on { background: var(--amber); }
    .mini-chart { width: 100%; height: 120px; }
    .mini-chart .grid { stroke: var(--line); stroke-width: 1; }
    .mini-chart .line { fill: none; stroke: var(--green); stroke-width: 2.2; vector-effect: non-scaling-stroke; }
    .mini-chart .area { fill: rgba(131,169,109,.1); }
    .mini-chart .target { fill: rgba(131,169,109,.12); }
    .action-strip { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: transparent; color: var(--muted); }
    .choice.active { border-color: var(--green); background: rgba(131,169,109,.12); color: var(--text); }
    .capture-context { display: grid; grid-template-columns: repeat(3,1fr); margin: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .capture-context span { padding: 11px 8px; }
    .capture-context span + span { border-left: 1px solid var(--line); }
    .capture-context small, .capture-context strong { display: block; }
    .capture-context small { color: var(--muted); font-size: 8px; }
    .capture-context strong { margin-top: 4px; font-size: 10px; }

    .review-map { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .map-item { display: grid; min-height: 178px; align-content: space-between; gap: 20px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); text-align: left; }
    .map-item:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .map-number { color: var(--green-bright); font-size: 10px; }
    .map-item h2 { margin-bottom: 7px; font-size: 19px; font-weight: 590; }
    .map-item p { margin-bottom: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .map-footer { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 8px; }

    .journal-page .page-head { margin-bottom: 20px; }
    .journal-page .page-head h1 { font-size: clamp(28px,2.7vw,36px); }
    .journal-page h2 { letter-spacing: -.015em; }
    .journal-a { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; align-items: start; }
    .composer-rail { position: sticky; top: 18px; }
    .compact-composer { overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); }
    .compact-composer-head { display: flex; min-height: 48px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .compact-composer-head strong { font-size: 13px; }
    .compact-composer-head small { color: var(--muted); font-size: 10px; }
    .composer-close { display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 20px; }
    .composer-close:hover { background: var(--surface-2); color: var(--text); }
    .composer-toolbar { display: grid; grid-template-columns: minmax(0,1fr) minmax(118px,.72fr) 178px; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .composer-control { min-width: 0; }
    .composer-control span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .composer-control select, .composer-control input { width: 100%; min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 11px; }
    .composer-control input { font-variant-numeric: tabular-nums; }
    .composer-text { display: block; width: 100%; min-height: 118px; padding: 15px 16px; border: 0; background: transparent; color: var(--text); font-size: 14px; line-height: 1.55; resize: vertical; }
    .composer-text::placeholder { color: var(--muted); }
    .composer-text:focus { outline: 0; }
    .context-summary { border-top: 1px solid var(--line); }
    .context-summary summary { display: flex; min-height: 38px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; color: var(--muted); cursor: pointer; font-size: 10px; list-style: none; }
    .context-summary summary::-webkit-details-marker { display: none; }
    .context-summary summary span { display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
    .context-summary summary .icon { width: 14px; height: 14px; color: var(--green-bright); }
    .context-summary-values { display: grid; grid-template-columns: repeat(4,1fr); padding: 0 16px 12px; }
    .context-summary-values span { padding-left: 10px; border-left: 1px solid var(--line); }
    .context-summary-values span:first-child { padding-left: 0; border-left: 0; }
    .context-summary-values small, .context-summary-values strong { display: block; }
    .context-summary-values small { color: var(--muted); font-size: 8px; }
    .context-summary-values strong { margin-top: 3px; font-size: 10px; }
    .composer-actions { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px 8px 16px; border-top: 1px solid var(--line); }
    .composer-actions small { color: var(--muted); font-size: 9px; }
    .composer-actions .button { min-height: 36px; }
    .composer-rail .composer-toolbar { grid-template-columns: 1fr 1fr; }
    .composer-rail .composer-control.time-control { grid-column: 1 / -1; }
    .composer-rail .composer-text { min-height: 142px; }
    .journal-log { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
    .journal-history-head { display: flex; min-height: 70px; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .journal-history-head h2 { margin-bottom: 3px; font-size: 18px; font-weight: 650; }
    .journal-history-head p { margin-bottom: 0; color: var(--muted); font-size: 10px; }
    .journal-log-actions { display: flex; align-items: center; gap: 8px; }
    .journal-filterbar { display: flex; gap: 7px; }
    .journal-filter span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .journal-filter select { min-width: 126px; min-height: 34px; padding: 0 28px 0 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 10px; }
    .activity-list { padding: 0 18px 6px; }
    .activity-day { display: flex; align-items: center; gap: 10px; margin: 0; padding: 16px 0 7px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .activity-day::after { flex: 1; height: 1px; background: var(--line); content: ""; }
    .activity-row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .activity-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--green-bright); }
    .activity-mark .icon { width: 15px; height: 15px; }
    .activity-mark.inspect, .activity-mark.observation { color: var(--blue); }
    .activity-mark.plan, .activity-mark.stageChange { color: var(--amber); }
    .activity-main { min-width: 0; }
    .activity-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--muted); font-size: 10px; }
    .activity-kicker strong { color: var(--text); font-size: 11px; }
    .activity-main p { margin-bottom: 7px; font-size: 13px; line-height: 1.45; }
    .activity-context { color: var(--muted); font-size: 9px; }
    .activity-context span { display: inline-flex; align-items: center; gap: 5px; }
    .activity-context .icon { width: 12px; height: 12px; }
    .activity-end { display: grid; justify-items: end; gap: 8px; }
    .activity-row time { padding-top: 1px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .journal-b { display: grid; gap: 16px; }
    .composer-inline .composer-text { min-height: 82px; }
    .daybook-body { padding: 0 18px 6px; }
    .daybook-day { display: grid; grid-template-columns: 104px minmax(0,1fr); border-bottom: 1px solid var(--line); }
    .daybook-date { padding: 17px 14px 17px 0; }
    .daybook-date strong, .daybook-date small { display: block; }
    .daybook-date strong { font-size: 12px; }
    .daybook-date small { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .daybook-entries { border-left: 1px solid var(--line); }
    .daybook-entries .activity-row { padding-left: 18px; }
    .daybook-entries .activity-row:last-child { border-bottom: 0; }
    .journal-c { width: min(1040px,100%); margin: 0 auto; }
    .journal-drawer-scrim { position: fixed; z-index: 90; inset: 0; background: rgba(4,7,5,.58); backdrop-filter: blur(2px); }
    .journal-drawer { position: absolute; top: 0; right: 0; width: min(430px,100%); height: 100%; padding: 18px; overflow-y: auto; border-left: 1px solid var(--line-strong); background: var(--bg); box-shadow: -18px 0 50px rgba(0,0,0,.34); }
    .journal-drawer .compact-composer { border-radius: var(--radius-lg); }
    .journal-drawer .composer-toolbar { grid-template-columns: 1fr 1fr; }
    .journal-drawer .composer-control.time-control { grid-column: 1 / -1; }
    .journal-drawer .composer-text { min-height: 170px; }

    .archive-table, .compare-table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    .archive-table th, .archive-table td, .compare-table th, .compare-table td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 10px; vertical-align: top; }
    .archive-table th, .compare-table th { color: var(--muted); font-size: 8px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

    .phase-axis { display: grid; margin: 20px 0 28px; overflow-x: auto; padding: 6px 2px 2px; }
    .phase-node { position: relative; min-width: 132px; padding: 18px 12px 10px 0; border: 0; border-top: 2px solid var(--line-strong); border-radius: 0; background: transparent; color: var(--text); text-align: left; }
    .phase-node::before { position: absolute; top: -6px; left: 0; width: 10px; height: 10px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--surface); content: ""; }
    .phase-node:hover { color: var(--green-bright); }
    .phase-node.done, .phase-node.current { border-color: var(--green); }
    .phase-node.done::before, .phase-node.current::before { border-color: var(--green); background: var(--green); }
    .phase-node.selected { background: transparent; color: var(--green-bright); }
    .phase-node.selected::before { border-color: var(--green-bright); box-shadow: 0 0 0 4px rgba(131,169,109,.14); }
    .phase-node.selected strong, .phase-node.selected small { color: var(--green-bright); }
    .phase-node strong, .phase-node small { display: block; }
    .phase-node small { margin-top: 4px; color: var(--muted); font-size: 8px; }
    .phase-layout { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 18px; }
    .phase-item { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .phase-item.drag-over { background: rgba(131,169,109,.1); }
    .phase-item.selected .phase-select { color: var(--green-bright); }
    .drag { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 13px; cursor: grab; }
    .drag:hover, .drag:focus-visible { border-color: var(--line-strong); background: var(--surface-2); color: var(--text); }
    .drag:active { cursor: grabbing; }
    .phase-select { padding: 4px 0; border: 0; background: transparent; color: var(--text); text-align: left; }
    .phase-item strong, .phase-item small { display: block; }
    .phase-item small { margin-top: 4px; color: var(--muted); font-size: 8px; }
    .phase-target { margin: 18px 0 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .phase-target small, .phase-target strong { display: block; }
    .phase-target small { color: var(--muted); font-size: 8px; }
    .phase-target strong { margin-top: 5px; color: var(--green-bright); font-size: 18px; }

    .sensor-layout { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 18px; }
    .source-preview { position: sticky; top: 20px; align-self: start; }
    .source-value { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 18px 0 8px; }
    .source-value strong { font-size: 36px; font-weight: 580; }
    .source-value small { color: var(--muted); }
    .entity-code { color: var(--blue); font-family: Consolas, monospace; font-size: 9px; }
    .sensor-binding-row { grid-template-columns: minmax(170px,1fr) minmax(260px,1.5fr) 112px; }
    .sensor-binding-row .entity-code { display: block; overflow-wrap: anywhere; }
    .binding-map { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; gap: 8px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .binding-arrow { color: var(--muted); text-align: center; }

    .strain-layout { display: grid; grid-template-columns: minmax(330px,.85fr) minmax(0,1.15fr); gap: 18px; }
    .search-line { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
    .result-list { margin-top: 13px; border-top: 1px solid var(--line); }
    .strain-result { display: grid; grid-template-columns: 70px minmax(0,1fr) auto; gap: 12px; align-items: center; width: 100%; margin-top: 5px; padding: 9px; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; text-align: left; }
    .strain-result.active { background: var(--surface-2); }
    .strain-result img { width: 70px; height: 58px; border-radius: var(--radius-sm); object-fit: cover; }
    .strain-result strong, .strain-result small { display: block; }
    .strain-result small { margin-top: 3px; color: var(--muted); font-size: 8px; }
    .strain-detail-photo { width: 100%; height: 260px; object-fit: cover; }
    .provider-copy { padding: 18px 20px 0; }
    .provider-warning { padding: 12px; border-left: 3px solid var(--amber); border-radius: var(--radius-md); background: rgba(209,170,72,.08); color: var(--muted); font-size: 10px; line-height: 1.5; }
    .strain-search-page { width: min(1100px,100%); margin: 0 auto; }
    .strain-query-shell { display: grid; grid-template-columns: minmax(0,1fr) 220px; gap: 8px; padding: 9px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 12px 34px rgba(0,0,0,.12); }

    .strain-preview-placeholder { display: grid; width: 76px; height: 76px; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); color: var(--muted); font-size: 19px; }

    .strain-preview-facts { border-top: 1px solid var(--line); }

    .strain-empty-search { min-height: 280px; padding: 40px 20px; color: var(--muted); text-align: center; }
    .strain-inline-page { width: min(860px,100%); margin: 0 auto; }
    .strain-inline-preview { margin: 0 14px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); background: var(--surface-2); }
    .strain-inline-preview .strain-preview { position: static; border: 0; border-radius: inherit; }
    .strain-drawer-scrim { position: fixed; z-index: 90; inset: 0; background: rgba(4,7,5,.58); backdrop-filter: blur(2px); }
    .strain-drawer { position: absolute; top: 0; right: 0; width: min(440px,100%); height: 100%; overflow-y: auto; border-left: 1px solid var(--line-strong); background: var(--bg); box-shadow: -18px 0 50px rgba(0,0,0,.34); }
    .strain-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .strain-drawer .strain-preview { position: static; border: 0; border-radius: 0; }

    .finish-layout { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 18px; }
    .finish-steps { border-top: 1px solid var(--line); }
    .finish-step { display: grid; grid-template-columns: 28px 1fr; gap: 9px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; }

    .archive-gallery { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
    .archive-card { display: grid; overflow: hidden; grid-template-rows: 180px auto; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); text-align: left; }
    .archive-card img { width: 100%; height: 180px; object-fit: cover; filter: saturate(.8); }

    .archive-card dt { color: var(--muted); font-size: 8px; }
    .archive-card dd { margin: 3px 0 0; font-size: 11px; font-weight: 700; }
    .archive-split { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 18px; }
    .archive-preview { position: sticky; top: 20px; align-self: start; }

    .completed-hero { display: grid; overflow: hidden; grid-template-columns: 300px minmax(0,1fr); border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); }
    .completed-hero img { width: 300px; height: 270px; object-fit: cover; filter: saturate(.8); }
    .completed-copy { display: grid; align-content: space-between; padding: 25px; }
    .completed-copy h1 { margin-bottom: 5px; font-size: 31px; font-weight: 590; }
    .fact-strip { display: grid; overflow: hidden; grid-template-columns: repeat(5,1fr); margin-top: 18px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
    .fact-strip span { padding: 14px; }
    .fact-strip span + span { border-left: 1px solid var(--line); }
    .fact-strip small, .fact-strip strong { display: block; }
    .fact-strip small { color: var(--muted); font-size: 8px; }
    .fact-strip strong { margin-top: 5px; font-size: 11px; }
    .completed-grid { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(300px,.7fr); gap: 18px; margin-top: 18px; }

    .compare-head { display: grid; overflow: hidden; grid-template-columns: 190px 1fr 1fr; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }

    .compare-plant small { margin-top: 4px; color: var(--muted); font-size: 8px; }
    .compare-overlay { margin-top: 18px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); }
    .legend { display: flex; gap: 16px; color: var(--muted); font-size: 9px; }
    .legend i { display: inline-block; width: 18px; height: 2px; margin-right: 6px; vertical-align: 3px; background: var(--green); }
    .legend i.alt { background: var(--blue); }

    .settings-layout { display: grid; grid-template-columns: minmax(0,1fr) 390px; gap: 18px; }
    .setting-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: center; min-height: 64px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .setting-row strong, .setting-row small { display: block; }
    .setting-row small { margin-top: 4px; color: var(--muted); font-size: 9px; }
    .switch { position: relative; width: 42px; height: 23px; padding: 0; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2); }
    .switch::after { position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--muted); content: ""; transition: transform .16s; }
    .switch.on::after { transform: translateX(19px); background: var(--green); }
    .settings-preview { position: sticky; top: 20px; align-self: start; }

    .states-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
    .state-sample { min-height: 250px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); }
    .state-sample h2 { margin-bottom: 7px; font-size: 18px; }
    .state-sample p { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .empty-mark { display: grid; width: 52px; height: 52px; margin-bottom: 26px; place-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-lg); color: var(--green-bright); }
    .skeleton { display: grid; gap: 9px; }
    .skeleton i { display: block; height: 13px; border-radius: var(--radius-sm); background: var(--surface-3); animation: pulse 1.4s infinite alternate; }
    .skeleton i:nth-child(2) { width: 72%; }
    .skeleton i:nth-child(3) { width: 45%; }

    .ha-stage { min-height: 690px; padding: 34px; background: #101417; color: #e7ebed; font-family: Roboto,"Segoe UI",sans-serif; }
    .ha-toolbar { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto 25px; }
    .ha-toolbar h1 { margin: 0; font-size: 24px; font-weight: 400; }

    .ha-plant strong, .ha-plant small { display: block; }
    .ha-plant small { margin-top: 4px; color: #aeb6ba; font-size: 11px; }
    .ha-actions { display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid rgba(255,255,255,.1); }

    .ha-chart-card { grid-column: 1 / -1; }

    .idea-flow { display: grid; overflow: hidden; grid-template-columns: repeat(4,1fr); border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--surface); }

    .idea-step strong, .idea-step small { display: block; }
    .idea-step small { margin-top: 6px; color: var(--muted); font-size: 9px; line-height: 1.45; }

    .prototype-switcher { position: fixed; z-index: 80; bottom: 18px; left: 50%; display: grid; min-width: 280px; overflow: hidden; grid-template-columns: 46px 1fr 46px; gap: 4px; padding: 5px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; background: rgba(6,9,7,.95); color: white; box-shadow: 0 14px 45px rgba(0,0,0,.45); }

      .archive-gallery { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .fact-strip { grid-template-columns: repeat(3,1fr); }

    @media (max-width: 760px) {

      .brand, .rail-button.bottom, .rail-button.optional-mobile { display: none; }

      .topbar { margin-bottom: 20px; }

      .page-head { display: block; }

      .review-map, .states-grid, .archive-gallery { grid-template-columns: 1fr; }

      .field-grid, .phase-layout, .finish-layout, .finish-summary, .completed-hero, .compare-head, .ha-grid { grid-template-columns: 1fr; }
      .completed-hero img { width: 100%; height: 260px; }
      .fact-strip { grid-template-columns: 1fr 1fr; }
      .fact-strip span + span { border-left: 0; }
      .fact-strip span { border-bottom: 1px solid var(--line); }
      .journal-history-head { display: block; }
      .journal-log-actions { justify-content: space-between; margin-top: 12px; }
      .daybook-day { grid-template-columns: 1fr; }
      .daybook-date { padding-bottom: 10px; }
      .daybook-entries { border-left: 0; }
      .daybook-entries .activity-row { padding-left: 0; }
      .archive-table { display: block; overflow-x: auto; }
      .context-summary-values, .capture-context, .idea-flow { grid-template-columns: 1fr 1fr; }
      .context-summary-values span:nth-child(3) { padding-left: 0; border-left: 0; }
      .context-summary-values span:nth-child(n+3) { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
      .idea-step + .idea-step { border-left: 0; border-top: 1px solid var(--line); }
      .prototype-state { display: none; }

      .ha-stage { padding: 18px 12px 120px; }
      .strain-preview { position: static; }
    }
    @media (max-width: 480px) {
      .review-map, .capture-context, .fact-strip, .idea-flow { grid-template-columns: 1fr; }
      .composer-toolbar, .composer-rail .composer-toolbar, .journal-drawer .composer-toolbar { grid-template-columns: 1fr; }
      .composer-rail .composer-control.time-control, .journal-drawer .composer-control.time-control { grid-column: 1; }
      .context-summary summary { display: block; padding: 10px 14px; }
      .context-summary summary small { display: block; margin-top: 4px; }
      .context-summary-values { grid-template-columns: 1fr 1fr; }
      .composer-actions { align-items: stretch; flex-direction: column; }
      .composer-actions .button { width: 100%; }
      .capture-context span + span { border-top: 1px solid var(--line); border-left: 0; }
      .journal-filterbar { display: grid; grid-template-columns: 1fr 1fr; }
      .journal-filter select { width: 100%; min-width: 0; }
      .journal-log-actions { display: grid; grid-template-columns: 1fr; }
      .journal-log-actions .button { width: 100%; }
      .activity-row { grid-template-columns: 34px minmax(0,1fr); }
      .activity-mark { width: 32px; height: 32px; }
      .activity-end { grid-column: 2; grid-row: 2; grid-auto-flow: column; justify-content: space-between; justify-items: start; }
      .journal-drawer { padding: 10px; }
      .strain-query-shell { grid-template-columns: 1fr; }
      .strain-query-shell select { border-top: 1px solid var(--line); border-left: 0; }
      .strain-provider-line { align-items: flex-start; flex-direction: column; }
      .strain-hit { grid-template-columns: 1fr; }
      .strain-hit-meta { min-width: 0; grid-auto-flow: column; justify-content: space-between; justify-items: start; }
      .strain-preview-facts div { grid-template-columns: 1fr; gap: 4px; }
      .rule-row, .binding-map { grid-template-columns: 1fr; }
      .binding-arrow { transform: rotate(90deg); }
      .phase-axis { overflow-x: auto; grid-template-columns: repeat(4,120px); }
      .archive-card { grid-template-rows: 220px auto; }
      .archive-card img { height: 220px; }
      .top-actions .button { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }

    function strainPreview(p){if(!p)return `<aside class="strain-preview"><div class="strain-empty-search">${state.lang==="de"?"Wähle einen Treffer für die Vorschau.":"Select a result to preview it."}</div></aside>`;return `<aside class="strain-preview"><div class="strain-preview-media">${p.image?`<img src="${p.image}" alt="${escapeHtml(p.name)}">`:`<span class="strain-preview-placeholder">${strainInitials(p)}</span>`}</div><div class="strain-preview-body"><p class="section-label">SeedFinder · ${t("preview")}</p><h2>${escapeHtml(p.name)}</h2><p>${escapeHtml(p.breeder)}</p><dl class="strain-preview-facts"><div><dt>${t("providerValue")}</dt><dd>${strainDuration(p)}</dd></div><div><dt>${t("meaning")}</dt><dd>${t(p.meaning)}</dd></div><div><dt>${t("originalWording")}</dt><dd>${escapeHtml(p.original)}</dd></div><div><dt>${t("harvestWindow")}</dt><dd>${strainHarvestEstimate(p)} · ${state.lang==="de"?"ab Pflanzdatum 21.08.2026":"from planting date 21 Aug 2026"}</dd></div><div><dt>${t("source")}</dt><dd>SeedFinder · ${state.lang==="de"?"Detailseite nach Auswahl":"detail page after selection"}</dd></div></dl><div class="strain-preview-actions"><button class="button outline" data-provider-fail>${t("manual")}</button><button class="button primary" data-use-strain="${p.id}">${t("useData")}</button></div></div></aside>`}
    function manualStrainForm(){return `<section class="panel panel-pad strain-search-page"><div class="provider-warning">${t("providerOffline")}</div><div class="field-grid" style="margin-top:18px"><span class="field"><label>Strain</label><input value="Tangerine Dream Auto"></span><span class="field"><label>${t("breeder")}</label><input value="Zamnesia"></span><span class="field"><label>${t("providerValue")}</label><input value="70–77"></span><span class="field"><label>${t("meaning")}</label><select><option>${t("seedToHarvest")}</option><option>${t("floweringTime")}</option></select></span><span class="field full"><label>${t("originalWording")}</label><input value="10–11 weeks from seed to harvest"></span></div><div class="strain-preview-actions"><button class="button outline" data-provider-fail>${state.lang==="de"?"Zurück zur Suche":"Back to search"}</button><button class="button primary">${t("save")}</button></div></section>`}
    function renderStrainA(){const active=activeStrain();return state.providerFailed?manualStrainForm():`<section class="strain-search-page">${strainSearchBar()}<div class="strain-search-layout"><section class="strain-results-panel">${strainResultsHead()}${strainResultList()}</section>${strainPreview(active)}</div></section>`}
    function renderStrainB(){const active=activeStrain(),matches=matchingStrains();return state.providerFailed?manualStrainForm():`<section class="strain-inline-page">${strainSearchBar()}<section class="strain-results-panel">${strainResultsHead()}${matches.length?matches.map(item=>`${strainHit(item)}${item.id===active?.id?`<div class="strain-inline-preview">${strainPreview(item)}</div>`:""}`).join(""):strainResultList()}</section></section>`}
    function renderStrainC(){const active=activeStrain();return state.providerFailed?manualStrainForm():`<section class="strain-search-page">${strainSearchBar()}<section class="strain-results-panel">${strainResultsHead()}${strainResultList()}</section>${state.strainPreviewOpen&&active?`<div class="strain-drawer-scrim" data-close-strain-preview><aside class="strain-drawer" data-strain-drawer><header class="strain-drawer-head"><strong>${t("preview")}</strong><button class="composer-close" data-close-strain-preview aria-label="${t("close")}">×</button></header>${strainPreview(active)}</aside></div>`:""}</section>`}
    function renderStrain(){const content=state.variant==="B"?renderStrainB():state.variant==="C"?renderStrainC():renderStrainA();return shell(`${pageHead(t("strainTitle"),t("strainBlurb"),`<button class="button outline" data-view="map">${t("backMap")}</button>`)}${content}`)}
    function editFields(){const p=selectedPlant();return `<div class="field-grid"><span class="field"><label>Strain</label><input value="${p.name}"></span><span class="field"><label>${t("breeder")}</label><input value="${p.breeder}"></span><span class="field"><label>${t("nickname")}</label><input placeholder="${t("optional")}"></span><span class="field"><label>${t("plantDate")}</label><input type="date" value="2026-08-21"></span><span class="field"><label>${t("harvestWindow")}</label><input value="${p.harvest}"></span><span class="field"><label>${t("lightSchedule")}</label><input value="18/6"></span></div>`}
    function photoEditor(){const p=selectedPlant();return `<section class="panel"><img class="strain-detail-photo" src="${p.image}" alt="${p.name}"><div class="panel-pad"><p class="section-label">${t("breederImage")}</p><h2>${p.name}</h2><p class="prototype-note">${state.lang==="de"?"Wird angezeigt, bis ein eigenes Foto existiert.":"Displayed until a user photo exists."}</p><div class="action-strip" style="margin-top:15px"><button class="button small outline">${t("replacePhoto")}</button><button class="button small danger">${t("removeBreederImage")}</button></div></div></section>`}
    function renderEditA(){return `<div class="strain-layout">${photoEditor()}<section class="panel panel-pad"><header class="panel-head"><div><h2>${t("facts")}</h2><p>${t("allEditable")}</p></div></header>${editFields()}<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="button primary">${t("save")}</button></div></section></div>`}
    function renderEditB(){return `<section class="panel panel-pad"><div class="plant-id" style="margin-bottom:20px"><img src="${selectedPlant().image}" alt=""><span><strong>${selectedPlant().name}</strong><small>${selectedPlant().breeder}</small></span></div>${editFields()}<div class="rule-list" style="margin-top:18px"><div class="rule-row"><span><strong>${t("breederImage")}</strong><small>${state.lang==="de"?"Im Hintergrund gespeichert":"Stored in background"}</small></span><span>${t("userPhoto")}: ${t("notAssigned")}</span><button class="button small outline">${t("replacePhoto")}</button></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="button primary">${t("save")}</button></div></section>`}
    function renderEditC(){return `<div class="settings-layout"><section class="panel panel-pad"><header class="panel-head"><div><h2>${t("editTitle")}</h2><p>${t("allEditable")}</p></div></header>${editFields()}</section><aside class="panel settings-preview">${photoEditor()}<div class="panel-pad"><button class="button primary" style="width:100%">${t("save")}</button></div></aside></div>`}
    function renderEdit(){const content=state.variant==="B"?renderEditB():state.variant==="C"?renderEditC():renderEditA();return shell(`${pageHead(t("editTitle"),t("editBlurb"),`<button class="button outline" data-view="map">${t("backMap")}</button>`)}${content}`)}
    function finishSteps(){const labels=["harvestDate","harvestFacts","summary"];return `<nav class="finish-steps">${labels.map((key,index)=>`<button class="finish-step ${state.finishStep===index+1?"active":""}" data-finish-step="${index+1}"><i>${index+1}</i><span>${t(key)}</span></button>`).join("")}</nav>`}
    function finishStepContent(){if(state.finishDone)return `<section class="panel panel-pad" style="min-height:420px;display:grid;place-items:center;text-align:center"><div><span class="empty-mark" style="margin:0 auto 18px">${icon("check")}</span><h2>${t("runCompleted")}</h2><p class="prototype-note">${t("noDeletion")} · ${t("correction")}</p><button class="button primary" style="margin-top:14px" data-view="completed">${t("openRecord")}</button></div></section>`;if(state.finishStep===1)return `<section class="panel panel-pad"><header class="panel-head"><div><h2>${t("harvestDate")}</h2><p>${t("endsAtHarvest")}</p></div><span class="tag warn">${t("sensorWindow")}</span></header><div class="finish-summary"><img src="${selectedPlant().image}" alt=""><div><div class="field"><label>${t("harvestDate")}</label><input type="datetime-local" value="2026-11-03T18:30"></div><div class="provider-warning" style="margin-top:14px">${t("finishWarning")}</div><label class="setting-row" style="margin-top:10px"><span><strong>${t("addDrying")}</strong><small>${t("postHarvest")}</small></span><button class="switch on" data-toggle-setting="drying"></button></label></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="button primary" data-finish-next="2">${t("next")}</button></div></section>`;if(state.finishStep===2)return `<section class="panel panel-pad"><header class="panel-head"><div><h2>${t("harvestFacts")}</h2><p>${t("allEditable")}</p></div></header><div class="field-grid"><span class="field"><label>${t("wetYield")} · ${t("optional")}</label><input type="number" value="312"><small>g</small></span><span class="field"><label>${t("dryYield")} · ${t("optional")}</label><input type="number" placeholder="${t("laterYield")}"></span><span class="field"><label>${t("height")} · ${t("optional")}</label><input type="number" value="78"></span><span class="field"><label>${state.lang==="de"?"Erntenotiz":"Harvest note"}</label><input value="${state.lang==="de"?"Trichome überwiegend milchig":"Trichomes mostly cloudy"}"></span></div><div class="action-strip" style="justify-content:space-between;margin-top:18px"><button class="button outline" data-finish-next="1">${t("back")}</button><button class="button primary" data-finish-next="3">${t("next")}</button></div></section>`;return `<section class="panel panel-pad"><header class="panel-head"><div><h2>${t("summary")}</h2><p>${t("confirm")}</p></div></header><div class="finish-summary"><img src="${selectedPlant().image}" alt=""><div><div class="rule-list"><div class="rule-row"><span>${t("plant")}</span><strong>${selectedPlant().name}</strong><span>${selectedPlant().breeder}</span></div><div class="rule-row"><span>${t("harvestDate")}</span><strong>03.11.2026 · 18:30</strong><span class="tag good">${t("sensorWindow")}</span></div><div class="rule-row"><span>${t("wetYield")}</span><strong>312 g</strong><span>${t("dryYield")}: ${t("laterYield")}</span></div><div class="rule-row"><span>${t("postHarvest")}</span><strong>${t("drying")}</strong><span>${t("journal")}</span></div></div></div></div><div class="action-strip" style="justify-content:space-between;margin-top:18px"><button class="button outline" data-finish-next="2">${t("back")}</button><button class="button primary" data-finish-complete>${t("closeRun")}</button></div></section>`}
    function renderFinishA(){return `<div class="finish-layout">${finishSteps()}${finishStepContent()}</div>`}
    function renderFinishB(){return `<section class="panel panel-pad"><header class="panel-head"><div><h2>${t("closeRun")}</h2><p>${t("finishWarning")}</p></div><span class="tag warn">${t("sensorWindow")}</span></header><div class="field-grid"><span class="field"><label>${t("harvestDate")}</label><input type="datetime-local" value="2026-11-03T18:30"></span><span class="field"><label>${t("wetYield")}</label><input value="312 g"></span><span class="field"><label>${t("dryYield")} · ${t("optional")}</label><input placeholder="${t("laterYield")}"></span><span class="field"><label>${t("height")}</label><input value="78 cm"></span></div><label class="setting-row" style="margin-top:16px"><span><strong>${t("addDrying")}</strong><small>${t("postHarvest")}</small></span><button class="switch on"></button></label><div class="finish-summary" style="margin-top:18px"><img src="${selectedPlant().image}" alt=""><div class="rule-list"><div class="rule-row"><span>${t("plant")}</span><strong>${selectedPlant().name}</strong><span>${selectedPlant().breeder}</span></div><div class="rule-row"><span>${t("duration")}</span><strong>75 ${t("days")}</strong><span>21.08. – 03.11.</span></div></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="button primary" data-finish-complete>${t("closeRun")}</button></div></section>`}
    function renderFinishC(){return `<section style="width:min(850px,100%);margin:0 auto"><section class="panel panel-pad"><p class="section-label">${t("harvest")}</p><h2 style="font-size:29px">${selectedPlant().name}</h2><div class="phase-axis"><span class="phase-node done"><strong>${t("seedling")}</strong></span><span class="phase-node done"><strong>${t("vegetative")}</strong></span><span class="phase-node done"><strong>${t("flowering")}</strong></span><span class="phase-node current"><strong>${t("harvested")}</strong><small>03.11.2026</small></span></div><div class="provider-warning">${t("finishWarning")}</div><div class="field-grid" style="margin-top:18px"><span class="field"><label>${t("harvestDate")}</label><input type="datetime-local" value="2026-11-03T18:30"></span><span class="field"><label>${t("wetYield")}</label><input value="312 g"></span></div><div class="action-strip" style="justify-content:flex-end;margin-top:18px"><button class="button outline">${t("laterYield")}</button><button class="button primary" data-finish-complete>${t("closeRun")}</button></div></section></section>`}
    function renderFinish(){const content=state.variant==="B"?renderFinishB():state.variant==="C"?renderFinishC():renderFinishA();return shell(`${pageHead(t("finishTitle"),t("finishBlurb"),`<button class="button outline" data-view="map">${t("backMap")}</button>`)}${content}`)}
    function archiveCard(run){return `<button class="archive-card" data-open-run="${run.id}"><img src="${run.image}" alt="${run.name}"><span><h2>${run.name}</h2><p>${run.breeder} · ${run.dates}</p><dl><span><dt>${t("duration")}</dt><dd>${run.duration} ${t("days")}</dd></span><span><dt>${t("dryYield")}</dt><dd>${run.yield} g</dd></span></dl></span></button>`}
    function archiveRows(){return Object.values(archiveRuns).map(run=>`<tr><td><span class="plant-id"><img src="${run.image}" alt=""><span><strong>${run.name}</strong><small>${run.breeder}</small></span></span></td><td>${run.dates}</td><td>${run.duration} ${t("days")}</td><td>${run.yield} g</td><td>${run.entries}</td><td><button class="link-button" data-open-run="${run.id}">${t("openRecord")}</button></td></tr>`).join("")}
    function archiveSelectRows(){return Object.values(archiveRuns).map(run=>`<label class="rule-row"><span class="plant-id"><img src="${run.image}" alt=""><span><strong>${run.name}</strong><small>${run.breeder}</small></span></span><span>${run.dates}<small>${run.duration} ${t("days")} · ${run.yield} g</small></span><input type="checkbox" data-archive-select="${run.id}" ${state.archiveSelected.includes(run.id)?"checked":""}></label>`).join("")}
    function archivePreview(){const run=archiveRuns[state.archiveSelected[0]]||archiveRuns.apple;return `<aside class="panel archive-preview"><img class="strain-detail-photo" src="${run.image}" alt="${run.name}"><div class="panel-pad"><p class="section-label">${t("selected")}</p><h2>${run.name}</h2><p class="prototype-note">${run.breeder} · ${run.dates}</p>${miniChart(run.moisture)}<div class="action-strip" style="margin-top:15px"><button class="button small outline" data-open-run="${run.id}">${t("openRecord")}</button><button class="button small primary" data-view="compare" ${state.archiveSelected.length<2?"disabled":""}>${t("compare")}</button></div></div></aside>`}
    function renderArchiveA(){return `<section class="archive-gallery">${Object.values(archiveRuns).map(archiveCard).join("")}</section>`}
    function renderArchiveB(){return `<section class="panel panel-pad"><div class="action-strip"><button class="choice active">${t("sortNewest")}</button><button class="choice">2025</button><button class="choice">2024</button><button class="choice">2023</button></div><table class="archive-table"><thead><tr><th>${t("plant")}</th><th>${t("date")}</th><th>${t("duration")}</th><th>${t("dryYield")}</th><th>${t("entries")}</th><th></th></tr></thead><tbody>${archiveRows()}</tbody></table></section>`}
    function renderArchiveC(){return `<div class="archive-split"><section class="panel panel-pad"><header class="panel-head"><div><h2>${t("selectRuns")}</h2><p>${state.archiveSelected.length}/2 ${t("selected")}</p></div></header><div class="rule-list">${archiveSelectRows()}</div></section>${archivePreview()}</div>`}
    function renderArchive(){const content=state.variant==="B"?renderArchiveB():state.variant==="C"?renderArchiveC():renderArchiveA();return shell(`${pageHead(t("archiveTitle"),t("archiveBlurb"),`<button class="button primary" data-view="compare">${t("compare")}</button>`)}${content}`)}
    function completedHero(run=archiveRuns.apple){return `<section class="completed-hero"><img src="${run.image}" alt="${run.name}"><div class="completed-copy"><div><span class="tag good">${t("completed")}</span><h1>${run.name}</h1><p class="prototype-note">${run.breeder} · ${run.dates}</p></div><div><strong>${t("noDeletion")}</strong><p class="prototype-note">${t("correction")}</p><button class="button small outline" style="margin-top:10px">${t("edit")}</button></div></div></section>`}
    function completedFacts(run=archiveRuns.apple){return `<section class="fact-strip"><span><small>${t("duration")}</small><strong>${run.duration} ${t("days")}</strong></span><span><small>${t("dryYield")}</small><strong>${run.yield} g</strong></span><span><small>${t("entries")}</small><strong>${run.entries}</strong></span><span><small>${t("harvestDate")}</small><strong>09.03.2025</strong></span><span><small>${t("sensorWindow")}</small><strong>19.01. – 09.03.</strong></span></section>`}
    function completedTimeline(){return `<div class="timeline"><p class="timeline-day">09.03.2025</p><article class="entry"><header class="entry-head"><h3>${t("harvest")}</h3><time>18:10</time></header><p>${state.lang==="de"?"Geerntet und zum Trocknen aufgehängt.":"Harvested and hung to dry."}</p></article><p class="timeline-day">17.02.2025</p><article class="entry"><header class="entry-head"><h3>${t("inspect")}</h3><time>20:30</time></header><p>${state.lang==="de"?"Trichome überwiegend milchig, einzelne bernsteinfarben.":"Trichomes mostly cloudy with a few amber heads."}</p></article><p class="timeline-day">19.01.2025</p><article class="entry"><header class="entry-head"><h3>${t("plantDate")}</h3><time>12:00</time></header><p>${state.lang==="de"?"Samen eingesetzt, Lauf begonnen.":"Seed planted and run started."}</p></article></div>`}
    function renderCompletedA(){const run=archiveRuns.apple;return `${completedHero(run)}${completedFacts(run)}<div class="completed-grid"><section class="panel panel-pad"><header class="panel-head"><div><h2>${t("sensorSummary")}</h2><p>${t("normalized")}</p></div></header>${miniChart(run.moisture)}<div class="capture-context"><span><small>${t("minimum")}</small><strong>41 %</strong></span><span><small>${t("average")}</small><strong>52,3 %</strong></span><span><small>${t("maximum")}</small><strong>68 %</strong></span></div></section><section class="panel panel-pad"><h2>${t("timeline")}</h2>${completedTimeline()}</section></div>`}
    function renderCompletedB(){const run=archiveRuns.apple;return `<section class="panel panel-pad">${completedHero(run)}<div class="tabs" style="margin-top:18px"><button class="tab active">${t("facts")}</button><button class="tab">${t("sensorSummary")}</button><button class="tab">${t("journal")}</button></div><table class="archive-table"><tbody><tr><th>${t("duration")}</th><td>${run.duration} ${t("days")}</td><th>${t("dryYield")}</th><td>${run.yield} g</td></tr><tr><th>${t("temperature")}</th><td>Ø 24,4 °C</td><th>${t("humidity")}</th><td>Ø 61,8 %</td></tr><tr><th>${t("moisture")}</th><td>Ø 52,3 %</td><th>${t("entries")}</th><td>${run.entries}</td></tr></tbody></table><div style="margin-top:18px">${miniChart(run.moisture)}</div></section>`}
    function renderCompletedC(){const run=archiveRuns.apple;return `<section style="width:min(850px,100%);margin:0 auto">${completedHero(run)}${completedFacts(run)}<section class="panel panel-pad" style="margin-top:18px"><header class="panel-head"><div><h2>${t("development")}</h2><p>${t("sensorSummary")} + ${t("journal")}</p></div></header>${miniChart(run.moisture)}${completedTimeline()}</section></section>`}
    function renderCompleted(){const content=state.variant==="B"?renderCompletedB():state.variant==="C"?renderCompletedC():renderCompletedA();return shell(`${pageHead(t("completedTitle"),t("completedBlurb"),`<button class="button outline" data-view="archive">${t("archiveTitle")}</button>`)}${content}`)}
    function compareHeader(a,b){return `<section class="compare-head"><div><p class="section-label">${t("compare")}</p><strong>${t("sameTent")}</strong></div><div class="compare-plant"><img src="${a.image}" alt=""><span><strong>${a.name}</strong><small>${a.breeder}</small></span></div><div class="compare-plant"><img src="${b.image}" alt=""><span><strong>${b.name}</strong><small>${b.breeder}</small></span></div></section>`}
    function compareRows(a,b){const rows=[[t("duration"),`${a.duration} ${t("days")}`,`${b.duration} ${t("days")}`],[t("dryYield"),`${a.yield} g`,`${b.yield} g`],[t("entries"),a.entries,b.entries],[t("temperature"),"Ø 24,4 °C","Ø 23,9 °C"],[t("humidity"),"Ø 61,8 %","Ø 64,1 %"],[t("moisture"),"Ø 52,3 %","Ø 55,6 %"]];return rows.map(row=>`<tr><th>${row[0]}</th><td>${row[1]}</td><td>${row[2]}</td></tr>`).join("")}
    function renderCompareA(){const a=archiveRuns.apple,b=archiveRuns.amnesia;return `${compareHeader(a,b)}<table class="compare-table"><thead><tr><th>${t("metric")}</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${compareRows(a,b)}</tbody></table><div class="completed-grid"><section class="panel panel-pad"><h2>${a.name}</h2>${miniChart(a.moisture)}</section><section class="panel panel-pad"><h2>${b.name}</h2>${miniChart(b.moisture,true)}</section></div>`}
    function renderCompareB(){const a=archiveRuns.apple,b=archiveRuns.amnesia;return `${compareHeader(a,b)}<section class="compare-overlay"><header class="panel-head"><div><h2>${t("moisture")} · ${t("normalized")}</h2><p>${state.lang==="de"?"0 % ist Pflanzdatum, 100 % ist Ernte":"0% is planting date, 100% is harvest"}</p></div><span class="legend"><span><i></i>${a.name}</span><span><i class="alt"></i>${b.name}</span></span></header>${miniChart(a.moisture)}<div style="margin-top:-105px;pointer-events:none">${miniChart(b.moisture,true)}</div></section><table class="compare-table"><tbody>${compareRows(a,b)}</tbody></table>`}
    function renderCompareC(){const a=archiveRuns.apple,b=archiveRuns.amnesia;return `<section style="width:min(900px,100%);margin:0 auto">${compareHeader(a,b)}<section class="panel panel-pad" style="margin-top:18px"><p class="section-label">${t("difference")}</p><div class="rule-list"><div class="rule-row"><span><strong>${t("duration")}</strong><small>${t("differentStrain")}</small></span><span>${a.duration} ${t("days")} ↔ ${b.duration} ${t("days")}</span><strong>34 ${t("days")}</strong></div><div class="rule-row"><span><strong>${t("dryYield")}</strong><small>${t("sameTent")}</small></span><span>${a.yield} g ↔ ${b.yield} g</span><strong>50 g</strong></div><div class="rule-row"><span><strong>${t("moisture")}</strong><small>${t("average")}</small></span><span>52,3 % ↔ 55,6 %</span><strong>3,3 pp</strong></div></div>${miniChart(a.moisture)}</section></section>`}

      document.querySelectorAll("[data-open-run]").forEach(button=>button.onclick=()=>go("completed"));
      document.querySelectorAll("[data-archive-select]").forEach(input=>input.onchange=()=>{const id=input.dataset.archiveSelect;if(input.checked&&!state.archiveSelected.includes(id)){if(state.archiveSelected.length>=2)state.archiveSelected.shift();state.archiveSelected.push(id)}else if(!input.checked)state.archiveSelected=state.archiveSelected.filter(item=>item!==id);render()});
      document.querySelectorAll("[data-toggle-setting]").forEach(button=>button.onclick=()=>{const key=button.dataset.toggleSetting;if(key==="theme"){state.theme=state.theme==="dark"?"light":"dark";syncUrl()}else state.settings[key]=!state.settings[key];render()});
      document.querySelectorAll("[data-setting-language]").forEach(select=>select.onchange=()=>{state.lang=select.value;syncUrl();render()});
      document.querySelectorAll("[data-density]").forEach(button=>button.onclick=()=>{state.settings.density=button.dataset.density;render()});
      document.querySelectorAll("[data-system-state]").forEach(button=>button.onclick=()=>{state.systemState=button.dataset.systemState;render()});
    }
    document.addEventListener("keydown",event=>{if(["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName)||event.target.isContentEditable)return;if(event.key==="ArrowLeft")stepVariant(-1);if(event.key==="ArrowRight")stepVariant(1);if(event.key==="Escape"&&state.view!=="map")go("map")});
    render();
  </script>
</body>
</html>
